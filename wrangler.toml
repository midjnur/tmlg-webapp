name = "tmlg-webapp"
main = "src/worker.js"
compatibility_date = "2026-09-25"

routes = [
  { pattern = "themotorlist.ge", custom_domain = true }
]

# Static site output (built by build-site.sh)
# run_worker_first: every request hits src/worker.js first, so it can gate
# /docs/* (signed links only) and /media/* (hotlink protection) before
# falling through to the static assets below.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tmlg"
database_id = "ed5bc15a-6b46-4e81-a11d-6a8ace8e6ad4"

[vars]
ENVIRONMENT = "production"
# RESEND_API_KEY is a secret, not a var — set via: echo "key" | npx wrangler secret put RESEND_API_KEY
