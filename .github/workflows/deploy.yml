name: Deploy themotorlist.ge to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        id: cfg
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          if [ -z "$LEGAL_NAME" ] || [ -z "$CONTACT_EMAIL" ]; then
            echo "::notice::Not deploying yet. Add LEGAL_NAME and CONTACT_EMAIL variables (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.cfg.outputs.ready == 'true'
        env:
          LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: zsh ./build-site.sh || bash ./build-site.sh

      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=themotorlist
